services:
  web:
    build: .                  # ← This uses your Dockerfile with pdo_mysql, Composer, etc.
    container_name: laravel-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-seytest_adminpanel}
      DB_USERNAME: ${DB_USERNAME:-seytest_adminpanel}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}

  db:
    image: mysql:8.0
    container_name: laravel-db
    ports:
      - "3309:3306"             # Avoids XAMPP conflict
    volumes:
      - db-data:/var/lib/mysql
      - ./database_dump.sql:/docker-entrypoint-initdb.d/database_dump.sql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-seytest_adminpanel}
      MYSQL_USER: ${MYSQL_USER:-seytest_adminpanel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
